# Navigators (phase B) over the frozen learned driver. One config for all three memory variants:
#   python -m scripts.train_navigator --memory none|retention|junction
# Steps are decisions (~1.5-2 s of driving each). Budget: 180k decisions (~3,600 dives) per navigator, sized to
# what the CPU can simulate in ~1-1.5 h with all three training in parallel (each decision = ~20 driver steps).
seed: 0
n_envs: 32
envs_per_worker: 4                # 8 worker processes per navigator (three train in parallel on 24 cores)
net_arch: [128, 128]

ppo:
  n_steps: 64                     # x 32 envs = 2048 decisions per update
  batch_size: 512
  n_epochs: 5
  learning_rate: 3.0e-4
  gamma: 0.99                     # per decision (~2 s): a horizon of ~100 decisions
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

memory:                           # small: memory only has to choose exits
  retention: {hidden_size: 256, d_model: 64, n_heads: 4, d_k: 8, d_v: 8, gammas: [0.5, 0.8, 0.95, 0.99]}
  junction: {hidden_size: 512, d_model: 64, n_heads: 4, d_k: 8, d_v: 8, gammas: [0.5, 0.8, 0.95, 0.99],
             n_slots: 8, memo_dim: 21, merge_radius: 0.08}    # writes within 2 m update the same slot

bc:                               # warm start: imitate the map-aware teacher (scripts.collect_nav_demos)
  demos: runs/nav_demos.npz       # 40k decisions, 30% random valid exits executed (labels: the teacher's)
  epochs: 8
  lr: 1.0e-3
  seq_len: 64                     # recurrent: chunks of 64 decisions, like PPO's rollouts
  batch_seqs: 16
  batch: 512                      # MLP
  vf_coef: 0.05                   # returns are O(10): keep the value loss from swamping the imitation loss

base:
  driver_actor: runs/driver/driver.npz
  cruise_speed: 1.2
  empty_slot: remap               # every decision is a real exit or a turn-back (v1 runs: carry_on)
  env:
    max_steps: 1500
    sonar: {ping_interval: 0.4}
    reward: {k_energy: 1.0}

stages:
  - name: b1_easy                 # single passages and side branches
    steps: 40000
    env: {layout: [tunnel, branches], difficulty: [0.0, 0.5]}
  - name: b2_all                  # every cave type: mazes and boulder chokes need route memory
    steps: 80000
    env: {layout: [tunnel, maze, branches, crack, breakdown, maze], difficulty: [0.0, 0.75]}
  - name: b3_full                 # full difficulty, currents
    steps: 60000
    env: {layout: [tunnel, maze, branches, crack, breakdown, maze], difficulty: [0.0, 1.0],
          vehicle: {max_current: 0.2}}
